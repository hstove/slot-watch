name: Alchemy Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy with Alchemy
    runs-on: ubuntu-latest
    concurrency: deploy-group
    # Records each run as a deployment to the repo's existing "Production"
    # environment, so the latest prod deploy shows up on GitHub.
    environment:
      name: Production
      url: https://slotwatch.dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: bun typecheck
        name: Typecheck
      - run: bunx alchemy deploy --stage prod
        name: Deploy with Alchemy
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OBSERVER_TOKEN: ${{ secrets.OBSERVER_TOKEN }}
          KV_API_TOKEN: ${{ secrets.KV_API_TOKEN }}
          CF_KV_ACCOUNT_ID: ${{ secrets.CF_KV_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
          # Optional: auth routes return 503 until all three are set.
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Plain curl instead of a Docker-based action, which built its image
      # (~8s) at the start of every run. Same message as before.
      - name: Send Pushover Notification
        continue-on-error: true
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          STATUS: ${{ job.status }}
        run: |
          message="$(printf 'Repo: %s\nCommit: %s\nRef: %s\nStatus: %s' \
            "$GITHUB_REPOSITORY" "${GITHUB_SHA:0:8}" "$GITHUB_REF" "$STATUS")"
          curl -fsS --retry 3 https://api.pushover.net/1/messages.json \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=Slot Watch Deployed" \
            --form-string "message=$message"
